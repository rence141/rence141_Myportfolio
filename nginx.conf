server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing media must return 404 rather than the SPA's HTML document.
    # Nginx's static file handler supports byte ranges for mobile playback.
    location ~* \.mp4$ {
        types { video/mp4 mp4; }
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
